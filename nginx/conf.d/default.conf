server {
listen 80;
server_name _;
root /usr/share/nginx/html;
index index.html;

location ~* .(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|webp)$ {
expires 1y;
add_header Cache-Control "public, immutable";
try_files $uri =404;
}

location / {
try_files $uri $uri/ /index.html;
}

location /api/ {
proxy_pass http://backend:8081/api/;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_set_header Host $host;
proxy_cache_bypass $http_upgrade;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;
proxy_connect_timeout 10s;
proxy_send_timeout 10s;
}

error_page 404 /index.html;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), fullscreen=(self)" always;
charset utf-8;

# This is the authoritative CSP: nginx serves every HTML response in
# production (Express only ever answers /api/, where CSP is inert).
# Keep src/backend/server.mjs's helmet policy in step with this one.
#
# Removed as dead: the Google Fonts / rsms.me origins (Inter is bundled via
# @fontsource, no webfont is fetched), api.mapbox.com (VITE_MAPBOX_* is unused
# by the frontend), maps.googleapis.com in script-src (the map is an iframe
# embed, covered by frame-src, not the Maps JS API), the 'sha256-...' hash
# (no executable inline script exists), and every explicit host in img-src /
# connect-src that the broader `https:` source already permits.
#
# NOTE: 'unsafe-eval' is retained unverified — nothing here obviously needs it,
# but neither Marzipano nor OpenSeadragon has been tested without it. Drop it
# and exercise a panorama plus a deep-zoom image before assuming it is safe.
# `https:` in img-src/connect-src is likewise broad; narrowing it to the CDN
# and API origins would need those baked into this file at image build time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src www.google.com; frame-ancestors 'self'; object-src 'none'; worker-src blob:; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
}