name: CI Workflow

# The job name below ("test") is what a branch ruleset asks for under
# "Require status checks to pass". Renaming the job means updating the rule.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

# Deliberately not running frontend:build here: it chains
# scripts/prerender-photos.mjs, which reads environment through vite's loadEnv
# and would fail on a runner without those values. Add it once the required
# variables exist as repository secrets.
