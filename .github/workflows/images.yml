name: Images

# Builds both Docker images, and pushes them on main.
#
# This replaces the build-and-push half of scripts/prod-build.sh. That script
# still works and stays as a manual escape hatch, but the normal path is now:
#
#   merge to main  →  this workflow builds + pushes  →  deploy on the Synology
#
# Two things make building here possible at all:
#   • data/photos.json is committed, so scripts/prerender-photos.mjs does not
#     need to reach the live API during the build (see README).
#   • The runner is amd64, matching `platform: linux/amd64` in
#     docker-compose.yml — no QEMU emulation, unlike building on an M-series Mac.
#
# Pull requests build but do NOT push. That deliberately closes the gap noted in
# ci.yml: unit tests never exercise `frontend:build`, but building the frontend
# image does, so a broken prerender or Vite config fails here before merging.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: wrangel/abstractaltitudes-backend
  FRONTEND_IMAGE: wrangel/abstractaltitudes-frontend
  # Matches the tag hard-coded in docker-compose.yml, so the Synology keeps
  # working unchanged. Each build also gets a sha- tag for rollback.
  RELEASE_TAG: "2.1"

jobs:
  images:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only main publishes. PRs build to verify and stop there.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          # Loaded too, for the NAS-setup smoke test below.
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # REQUIRE_PRERENDER stays at its default of 1: a production image must
      # never ship the footer's "Browse by location" link with no /places/
      # pages behind it. With the committed snapshot present this cannot fail
      # for lack of an API.
      # load, not push. `push: true` sends the image straight to the registry
      # without ever putting it in the local daemon, so the smoke test below
      # could not `docker run` it — on a pull request nothing was pushed
      # either, and the step failed with "manifest unknown". Loading first
      # means the image is tested before it is published, which is the right
      # order anyway; the push happens after the test passes.
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_BUNNYCDN_BASE_URL=${{ vars.VITE_BUNNYCDN_BASE_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            SITE_ORIGIN=${{ vars.SITE_ORIGIN }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Cheap proof the frontend image is actually serving what we think it is.
      # No database needed — these are static files written by the prerender.
      # --add-host is required, not cosmetic: nginx resolves the `backend`
      # upstream in default.conf at startup and exits with
      # "host not found in upstream" when it cannot, so the container will not
      # boot standalone. Pointing the name at loopback lets nginx start; /api/
      # then 502s, which is irrelevant here — this step only exercises the
      # static files the prerender wrote.
      - name: Smoke-test the frontend image
        run: |
          docker run -d --name smoke -p 8080:80 \
            --add-host backend:127.0.0.1 \
            "${FRONTEND_IMAGE}:sha-${{ steps.sha.outputs.short }}"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          fail() { echo "::error::$1"; docker logs smoke; exit 1; }
          curl -sf http://localhost:8080/ >/dev/null || fail "/ did not serve"
          curl -sf http://localhost:8080/places/ >/dev/null || fail "/places/ missing — prerender did not run"
          curl -sf http://localhost:8080/license/ >/dev/null || fail "/license/ missing"
          n=$(curl -s http://localhost:8080/sitemap.xml | grep -c "<loc>")
          echo "sitemap URLs: $n"
          [ "$n" -gt 100 ] || fail "sitemap has only $n URLs — expected the full set"

          # Photo pages carry their own visible content (src/shared/photoBody.mjs),
          # not just "enable JavaScript" — what crawlers and link previews see.
          photo=$(curl -s http://localhost:8080/sitemap.xml | grep -oE '/photo/[^<]+/' | head -1)
          page=$(curl -s "http://localhost:8080$photo")
          echo "$page" | grep -q '<h1' || fail "$photo has no <h1> — photo body not prerendered"
          echo "$page" | grep -q 'class="prerendered-photo"' || fail "$photo lacks its prerendered content"
          echo "$page" | grep -q 'You need to enable JavaScript' && fail "$photo still shows the generic noscript notice"

          # Cache headers (nginx/templates/default.conf.template): hashed assets forever,
          # other static files briefly, the crawler policy never, and the
          # security headers on all of them.
          hdr() { curl -s -D - -o /dev/null "http://localhost:8080$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          asset=$(curl -s http://localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          [ -n "$asset" ] || fail "no /assets/*.js referenced from /"
          case "$(hdr "$asset" cache-control)" in *max-age=315360000*) ;; *) fail "$asset is not cached long-term";; esac
          case "$(hdr /og-image.jpg cache-control)" in max-age=3600) ;; *) fail "og-image.jpg must be cached for 1h, got: $(hdr /og-image.jpg cache-control)";; esac
          case "$(hdr /robots.txt cache-control)" in no-cache) ;; *) fail "robots.txt must not be cached";; esac
          case "$(hdr /sitemap.xml cache-control)" in no-cache) ;; *) fail "sitemap.xml must not be cached";; esac
          for f in "$asset" /og-image.jpg /robots.txt; do
            [ -n "$(hdr "$f" content-security-policy)" ] || fail "$f lost the security headers"
          done
          # A slashless place URL must redirect, not be mistaken for a file.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/places/switzerland)
          [ "$code" = "301" ] || fail "/places/switzerland answered $code, expected 301"
          loc=$(hdr /places/switzerland location)
          [ "$loc" = "/places/switzerland/" ] || fail "redirect must be relative, got: $loc"
          docker rm -f smoke

      # The production setup on the NAS (docker-compose.nas.yml): both
      # containers on the host network, nginx on 127.0.0.1:3000 reaching the
      # backend at 127.0.0.1:8081 — the configuration that replaced the Docker
      # bridge after it broke three times. Proven here before it reaches the NAS.
      - name: Smoke-test the NAS setup (host network)
        run: |
          fail() { echo "::error::$1"; docker logs nas-frontend; docker logs nas-backend; exit 1; }
          # Dummy settings: the server starts and answers without a database.
          docker run -d --name nas-backend --network host \
            -e NODE_ENV=production -e PORT=8081 -e HOST=127.0.0.1 \
            -e MONGODB_DB_USER=x -e MONGODB_DB_PASSWORD=x -e MONGODB_SERVER=127.0.0.1:1 \
            -e MONGODB_DB=x -e CORS_ORIGINS=http://localhost \
            -e VITE_BUNNYCDN_BASE_URL=https://example.invalid \
            "${BACKEND_IMAGE}:sha-${{ steps.sha.outputs.short }}"
          docker run -d --name nas-frontend --network host \
            -e NGINX_LISTEN=127.0.0.1:3000 -e BACKEND_UPSTREAM=127.0.0.1:8081 \
            "${FRONTEND_IMAGE}:sha-${{ steps.sha.outputs.short }}"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done

          conf=$(docker exec nas-frontend cat /etc/nginx/conf.d/default.conf)
          echo "$conf" | grep -q 'listen 127.0.0.1:3000;' || fail "template did not set the listen address"
          echo "$conf" | grep -q 'proxy_pass http://127.0.0.1:8081/api/;' || fail "template did not set the backend address"
          echo "$conf" | grep -q 'proxy_set_header Host $host;' || fail "envsubst replaced nginx's own variables"

          curl -sf http://127.0.0.1:3000/ >/dev/null || fail "nginx does not serve on 127.0.0.1:3000"
          # Through nginx to the backend: without a database the backend itself
          # answers 503 with its rate-limit headers. nginx alone would give
          # 502/504 and no such header.
          hdr=$(curl -s -D - -o /dev/null http://127.0.0.1:3000/api/combined-data | tr -d '\r')
          echo "$hdr" | grep -qi '^ratelimit-limit:' || fail "nginx cannot reach the backend over the host network: $(echo "$hdr" | head -1)"

          # Neither may be reachable from outside the machine.
          ip=$(hostname -I | awk '{print $1}')
          for port in 3000 8081; do
            if curl -s -o /dev/null --max-time 3 "http://$ip:$port/"; then
              fail "port $port answers on $ip — must be bound to 127.0.0.1 only"
            fi
          done
          docker rm -f nas-frontend nas-backend

      # Only now, once the image has proven it serves the prerendered pages.
      - name: Push frontend
        if: github.event_name != 'pull_request'
        run: |
          docker push "${FRONTEND_IMAGE}:${RELEASE_TAG}"
          docker push "${FRONTEND_IMAGE}:sha-${{ steps.sha.outputs.short }}"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '```'
            echo "${BACKEND_IMAGE}:${RELEASE_TAG}"
            echo "${BACKEND_IMAGE}:sha-${{ steps.sha.outputs.short }}"
            echo "${FRONTEND_IMAGE}:${RELEASE_TAG}"
            echo "${FRONTEND_IMAGE}:sha-${{ steps.sha.outputs.short }}"
            echo '```'
            echo ""
            echo "Ready to deploy. Pull and recreate the stack on the host."
          } >> "$GITHUB_STEP_SUMMARY"
