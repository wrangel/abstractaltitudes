name: CI Workflow

# The job name below ("test") is what a branch ruleset asks for under
# "Require status checks to pass". Renaming the job means updating the rule.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs exactly the pnpm version in package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # See pmOnFail in pnpm-workspace.yaml. A second YAML document makes
      # GitHub's dependency graph — and every security alert built on it —
      # silently see only pnpm itself.
      - name: Lockfile is a single YAML document
        run: |
          if grep -q '^---$' pnpm-lock.yaml; then
            echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml has a second YAML document; GitHub's dependency graph cannot read past it. Check pmOnFail in pnpm-workspace.yaml, strip the pnpm document, re-run pnpm install."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lockfile still a single YAML document after install
        run: "! grep -q '^---$' pnpm-lock.yaml"

      - name: Unit tests
        run: pnpm test:unit

# Deliberately not running frontend:build here: it chains
# scripts/prerender-photos.mjs, which reads environment through vite's loadEnv
# and would fail on a runner without those values. Add it once the required
# variables exist as repository secrets.
